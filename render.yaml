services:
  # FastAPI backend (Invock Investments API)
  - type: web
    name: invock-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      # Set this to your deployed frontend URL (Vercel) after the first deploy.
      - key: CORS_ORIGINS
        sync: false

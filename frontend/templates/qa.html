{% extends "base.html" %}
{% block title %}Expert Q&A — PSX Insight{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Expert Q&amp;A</h1>
    <p class="page-sub">Ask questions, get answers from verified experts</p>
  </div>
  <button class="btn-primary" onclick="openAskModal()">+ Ask a Question</button>
</div>

<div id="qa-list" class="qa-list">
  <div class="loading-state">Loading discussions...</div>
</div>

<!-- Ask Modal -->
<div id="ask-modal" class="modal-overlay" style="display:none">
  <div class="modal-card">
    <h3 class="modal-title">Ask the Experts</h3>
    <div class="form-group">
      <label class="form-label">Your Question</label>
      <textarea id="q-input" class="form-textarea" placeholder="E.g. Is OGDC a good buy at current levels?"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAskModal()">Cancel</button>
      <button class="btn-primary" onclick="submitQuestion()">Submit Question</button>
    </div>
  </div>
</div>

<!-- Answer Modal -->
<div id="answer-modal" class="modal-overlay" style="display:none">
  <div class="modal-card">
    <h3 class="modal-title">Post Your Answer</h3>
    <p id="answer-question-preview" class="answer-preview"></p>
    <div class="form-group">
      <label class="form-label">Your Answer</label>
      <textarea id="a-input" class="form-textarea" placeholder="Provide your expert analysis..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAnswerModal()">Cancel</button>
      <button class="btn-primary" onclick="submitAnswer()">Post Answer</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const userRole = '{{ session.get("role") }}';
let answerTargetId = null;

async function loadQA() {
  const posts = await fetch('/api/qa').then(r=>r.json());
  const container = document.getElementById('qa-list');
  if (!posts.length) { container.innerHTML = '<div class="empty-state">No questions yet. Be the first to ask!</div>'; return; }

  container.innerHTML = posts.reverse().map(p => `
    <div class="qa-card ${p.answer ? 'answered' : 'unanswered'}">
      <div class="qa-header">
        <div class="qa-meta">
          <span class="qa-author">${p.author}</span>
          <span class="qa-role-badge ${p.role}">${p.role}</span>
          <span class="qa-date">${p.date}</span>
        </div>
        ${userRole==='expert'||userRole==='admin' ? `<button class="btn-delete" onclick="deletePost(${p.id})">✕</button>` : ''}
      </div>
      <p class="qa-question">${p.question}</p>
      ${p.answer ? `
        <div class="qa-answer">
          <div class="answer-badge">Expert Answer</div>
          <p class="answer-text">${p.answer}</p>
          <span class="answer-by">— ${p.answered_by}</span>
        </div>` : `
        <div class="qa-unanswered">
          <span class="pending-badge">Awaiting expert response</span>
          ${userRole==='expert'||userRole==='admin' ? `<button class="btn-answer" onclick="openAnswerModal(${p.id}, \`${p.question.replace(/`/g,"'")}\`)">Answer</button>` : ''}
        </div>`
      }
    </div>
  `).join('');
}

function openAskModal()    { document.getElementById('ask-modal').style.display='flex'; }
function closeAskModal()   { document.getElementById('ask-modal').style.display='none'; }
function openAnswerModal(id, q) {
  answerTargetId = id;
  document.getElementById('answer-question-preview').textContent = q;
  document.getElementById('answer-modal').style.display='flex';
}
function closeAnswerModal() { document.getElementById('answer-modal').style.display='none'; }

async function submitQuestion() {
  const q = document.getElementById('q-input').value.trim();
  if (!q) return;
  await fetch('/api/qa', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q})});
  document.getElementById('q-input').value='';
  closeAskModal();
  loadQA();
}

async function submitAnswer() {
  const a = document.getElementById('a-input').value.trim();
  if (!a) return;
  await fetch(`/api/qa/${answerTargetId}/answer`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({answer:a})});
  document.getElementById('a-input').value='';
  closeAnswerModal();
  loadQA();
}

async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  await fetch(`/api/qa/${id}`, {method:'DELETE'});
  loadQA();
}

loadQA();
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Invock Investments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="auth-body">
<div class="auth-container">
  <div class="auth-left">
    <div class="auth-brand">
      <span class="brand-icon-lg">📈</span>
      <h1 class="auth-title">Invock <span class="brand-accent">Investments</span></h1>
      <p class="auth-subtitle">Join Pakistan's intelligent stock analysis platform</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-card">
      <h2 class="auth-card-title">Create account</h2>
      <p class="auth-card-sub">Start analyzing PSX stocks today</p>
      <div id="auth-error" class="alert alert-error" style="display:none"></div>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="Ali Raza"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Min 6 characters"/>
      </div>
      <button onclick="doRegister()" class="btn-primary full-width" id="reg-btn">Create Account</button>
      <p class="auth-switch">Already have an account? <a href="/login">Sign In</a></p>
    </div>
  </div>
</div>
<script>
async function doRegister() {
  const btn = document.getElementById('reg-btn');
  btn.textContent = 'Creating...'; btn.disabled = true;
  const pw = document.getElementById('password').value;
  if (pw.length < 6) {
    document.getElementById('auth-error').textContent = 'Password must be at least 6 characters';
    document.getElementById('auth-error').style.display = 'block';
    btn.textContent = 'Create Account'; btn.disabled = false; return;
  }
  const res = await fetch('/api/register', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name: document.getElementById('name').value, email: document.getElementById('email').value, password: pw})
  });
  const data = await res.json();
  if (res.ok) { window.location.href = '/dashboard'; }
  else {
    document.getElementById('auth-error').textContent = data.error;
    document.getElementById('auth-error').style.display = 'block';
    btn.textContent = 'Create Account'; btn.disabled = false;
  }
}
</script>
</body>
</html>

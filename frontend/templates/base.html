<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}PSX Insight{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
{% if session.get('user') %}
<nav class="navbar">
  <div class="nav-brand">
    <span class="brand-icon">📈</span>
    <span class="brand-name">PSX<span class="brand-accent">Insight</span></span>
  </div>
  <div class="nav-links">
    <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/predict-page" class="nav-link {% if request.path == '/predict-page' %}active{% endif %}">Predictions</a>
    <a href="/watchlist" class="nav-link {% if request.path == '/watchlist' %}active{% endif %}">Watchlist</a>
    <a href="/qa" class="nav-link {% if request.path == '/qa' %}active{% endif %}">Expert Q&amp;A</a>
    <a href="/feedback" class="nav-link {% if request.path == '/feedback' %}active{% endif %}">Feedback</a>
    {% if session.get('role') == 'admin' %}
    <a href="/admin" class="nav-link {% if request.path == '/admin' %}active{% endif %}">Admin</a>
    {% endif %}
  </div>
  <div class="nav-user">
    <div class="notif-wrap">
      <button class="notif-bell" onclick="toggleNotifs(event)" aria-label="Notifications">
        🔔<span id="notif-count" class="notif-count" style="display:none">0</span>
      </button>
      <div id="notif-panel" class="notif-panel" style="display:none">
        <div class="notif-head">
          <span>Notifications</span>
          <button class="notif-clear" onclick="markNotifsRead()">Mark all read</button>
        </div>
        <div id="notif-list" class="notif-list"></div>
      </div>
    </div>
    <span class="user-badge {{ session.get('role') }}">{{ session.get('role') }}</span>
    <span class="user-name">{{ session.get('name') }}</span>
    <button onclick="logout()" class="btn-logout">Logout</button>
  </div>
</nav>
{% endif %}

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<script>
async function logout() {
  await fetch('/api/logout', {method:'POST'});
  window.location.href = '/login';
}

{% if session.get('user') %}
// ─── Notifications ───────────────────────────────────────────────────────────
const NOTIF_ICONS = {announcement:'📢', answer:'💬', feedback:'📝', info:'ℹ️'};

async function loadNotifs() {
  try {
    const data = await fetch('/api/notifications').then(r=>r.json());
    const countEl = document.getElementById('notif-count');
    if (data.unread > 0) { countEl.textContent = data.unread; countEl.style.display='flex'; }
    else { countEl.style.display='none'; }
    const list = document.getElementById('notif-list');
    if (!data.notifications.length) {
      list.innerHTML = '<div class="notif-empty">No notifications yet</div>';
      return;
    }
    list.innerHTML = data.notifications.map(n => `
      <div class="notif-item ${n.is_read ? '' : 'unread'}">
        <span class="notif-icon">${NOTIF_ICONS[n.type] || 'ℹ️'}</span>
        <div class="notif-body">
          <p class="notif-msg">${n.message}</p>
          <span class="notif-time">${n.created_at}</span>
        </div>
      </div>`).join('');
  } catch (e) { /* ignore transient errors */ }
}

function toggleNotifs(e) {
  e.stopPropagation();
  const panel = document.getElementById('notif-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

async function markNotifsRead() {
  await fetch('/api/notifications/read', {method:'POST'});
  loadNotifs();
}

document.addEventListener('click', e => {
  const wrap = document.querySelector('.notif-wrap');
  if (wrap && !wrap.contains(e.target)) document.getElementById('notif-panel').style.display='none';
});

loadNotifs();
setInterval(loadNotifs, 30000);  // poll every 30s
{% endif %}
</script>
{% block scripts %}{% endblock %}
</body>
</html>

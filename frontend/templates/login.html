<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — PSX Insight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="auth-body">
<div class="auth-container">
  <div class="auth-left">
    <div class="auth-brand">
      <span class="brand-icon-lg">📈</span>
      <h1 class="auth-title">PSX<span class="brand-accent">Insight</span></h1>
      <p class="auth-subtitle">Pakistan's intelligent stock analysis & prediction platform</p>
    </div>
    <div class="auth-stats">
      <div class="auth-stat"><span class="stat-num">97%</span><span class="stat-label">Model Accuracy</span></div>
      <div class="auth-stat"><span class="stat-num">1,800+</span><span class="stat-label">Data Points</span></div>
      <div class="auth-stat"><span class="stat-num">30-Day</span><span class="stat-label">Forecasts</span></div>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-card">
      <h2 class="auth-card-title">Welcome back</h2>
      <p class="auth-card-sub">Sign in to your account</p>
      <div id="auth-error" class="alert alert-error" style="display:none"></div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" value="user@psx.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" value="user123"/>
      </div>
      <button onclick="doLogin()" class="btn-primary full-width" id="login-btn">Sign In</button>
      <div class="auth-demo-hints">
        <p class="demo-label">Demo accounts:</p>
        <div class="demo-chips">
          <span class="chip" onclick="fillDemo('admin@psx.com','admin123')">Admin</span>
          <span class="chip" onclick="fillDemo('expert@psx.com','expert123')">Expert</span>
          <span class="chip" onclick="fillDemo('user@psx.com','user123')">Investor</span>
        </div>
      </div>
      <p class="auth-switch">Don't have an account? <a href="/register">Register</a></p>
    </div>
  </div>
</div>
<script>
function fillDemo(e, p) {
  document.getElementById('email').value = e;
  document.getElementById('password').value = p;
}
async function doLogin() {
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Signing in...'; btn.disabled = true;
  const res = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})
  });
  const data = await res.json();
  if (res.ok) { window.location.href = '/dashboard'; }
  else {
    document.getElementById('auth-error').textContent = data.error;
    document.getElementById('auth-error').style.display = 'block';
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>

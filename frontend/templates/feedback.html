{% extends "base.html" %}
{% block title %}Feedback — Invock Investments{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Feedback</h1>
    <p class="page-sub">Share suggestions, report issues or tell us what you think</p>
  </div>
</div>

<div class="feedback-layout">
  <!-- Submit form -->
  <div class="feedback-card">
    <h3 class="chart-title" style="margin-bottom:1rem">Submit Feedback</h3>
    <div id="fb-success" class="alert alert-success" style="display:none"></div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select id="fb-category" class="form-select full-width">
        <option>General</option>
        <option>Suggestion</option>
        <option>Bug Report</option>
        <option>Complaint</option>
        <option>Feature Request</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Your Message</label>
      <textarea id="fb-message" class="form-textarea" placeholder="Tell us what's on your mind..."></textarea>
    </div>
    <button class="btn-primary full-width" id="fb-btn" onclick="submitFeedback()">Send Feedback</button>
  </div>

  <!-- History -->
  <div class="feedback-history">
    <h3 class="chart-title" style="margin-bottom:1rem">Your Submissions</h3>
    <div id="fb-list"><div class="loading-state">Loading...</div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadFeedback() {
  const items = await fetch('/api/feedback').then(r=>r.json());
  const list = document.getElementById('fb-list');
  if (!items.length) { list.innerHTML = '<div class="empty-state">No feedback submitted yet.</div>'; return; }
  list.innerHTML = items.map(f => `
    <div class="fb-item">
      <div class="fb-item-head">
        <span class="fb-cat">${f.category}</span>
        <span class="status-badge ${f.status}">${f.status}</span>
      </div>
      <p class="fb-msg">${f.message}</p>
      <span class="fb-date">${f.created_at}</span>
      ${f.admin_response ? `<div class="fb-response"><strong>Admin:</strong> ${f.admin_response}</div>` : ''}
    </div>`).join('');
}

async function submitFeedback() {
  const category = document.getElementById('fb-category').value;
  const message  = document.getElementById('fb-message').value.trim();
  if (!message) return;
  const btn = document.getElementById('fb-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  const res = await fetch('/api/feedback', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({category, message})
  });
  const data = await res.json();
  const ok = document.getElementById('fb-success');
  ok.textContent = data.message; ok.style.display='block';
  document.getElementById('fb-message').value = '';
  btn.disabled = false; btn.textContent = 'Send Feedback';
  setTimeout(()=>ok.style.display='none', 4000);
  loadFeedback();
}

loadFeedback();
</script>
{% endblock %}
